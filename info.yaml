# Tiny Tapeout project information
project:
  title:        "Analog playground"      # Project title
  author:       "Park Frazer"      # Your name
  discord:      "porkfreezer"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A few configurable analog primitives"      # One line description of what your project does
  language:     "Analog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 3        # Valid values: 0 to 6
  uses_vapwr: true       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_analog_park"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "in0"
  ui[1]: "in1"
  ui[2]: "in2"
  ui[3]: "in3"
  ui[4]: "in4"
  ui[5]: "in5"
  ui[6]: "in6"
  ui[7]: "in7"

  # Outputs
  uo[0]: "out0"
  uo[1]: "out1"
  uo[2]: "out2"
  uo[3]: "out3"
  uo[4]: "out4"
  uo[5]: "out5"
  uo[6]: "out6"
  uo[7]: "out7"

  # Bidirectional pins
  uio[0]: "in8"
  uio[1]: "in9"
  uio[2]: "in10"
  uio[3]: "in11"
  uio[4]: "in12"
  uio[5]: "in13"
  uio[6]: "in14"
  uio[7]: "in15"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "ain0"
  ua[1]: "ain1"
  ua[2]: "aout"
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
